name: ASMR Hentai API Diagnostic

on:
  push:
    branches:
      - diagnostic/asmrhentai-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ASMR Hentai live API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.error

          BASE='https://newapi.asmrhentai.net'

          def encode(obj):
              raw=json.dumps(obj,separators=(',',':'),ensure_ascii=False).encode('utf-8')
              return bytes(((~b)&0xff) for b in raw)[::-1]

          def decode(raw):
              data=bytes(((~b)&0xff) for b in raw)[::-1]
              return json.loads(data.decode('utf-8'))

          def post(path,payload):
              req=urllib.request.Request(
                  BASE+path,
                  data=encode(payload),
                  method='POST',
                  headers={
                      'Content-Type':'f/s',
                      'Accept-Language':'',
                      'User-Agent':'Mozilla/5.0 Hiraukan-Diagnostic/1.0',
                  },
              )
              with urllib.request.urlopen(req,timeout=20) as r:
                  raw=r.read()
                  print(path,'HTTP',r.status,'bytes',len(raw))
              return decode(raw)

          def summarize(label,obj):
              print('\n===',label,'===')
              print('type:',type(obj).__name__)
              if isinstance(obj,dict):
                  print('keys:',list(obj.keys()))
                  for k,v in obj.items():
                      if isinstance(v,list):
                          print(' field',k,'list len',len(v))
                          if v:
                              print('  first type',type(v[0]).__name__)
                              print('  first',json.dumps(v[0],ensure_ascii=False)[:2500])
                      elif isinstance(v,dict):
                          print(' field',k,'dict keys',list(v.keys())[:30])
                      else:
                          print(' field',k,repr(v)[:800])
              elif isinstance(obj,list):
                  print('len:',len(obj))
                  if obj: print('first:',json.dumps(obj[0],ensure_ascii=False)[:2500])
              print('json head:',json.dumps(obj,ensure_ascii=False)[:6000])

          discover=post('/Core/Discover',{'a':'en','b':0,'c':0,'d':[]})
          summarize('DISCOVER',discover)

          # Use an id from discover when possible.
          def find_rj(x):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k=='a' and isinstance(v,str) and v.upper().startswith('RJ'):
                          return v.upper()
                      got=find_rj(v)
                      if got: return got
              elif isinstance(x,list):
                  for v in x:
                      got=find_rj(v)
                      if got: return got
              return None

          rj=find_rj(discover)
          print('\nselected RJ:',rj)

          search=post('/Core/Search',{'a':'en','b':rj or 'RJ','c':'','d':[],'e':0})
          summarize('SEARCH',search)

          if rj:
              info=post('/Core/Info',{'a':'en','b':rj})
              summarize('INFO',info)
          PY
