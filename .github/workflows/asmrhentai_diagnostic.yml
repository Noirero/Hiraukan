name: ASMR Hentai API Diagnostic

on:
  push:
    branches:
      - diagnostic/asmrhentai-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ASMR Hentai catalog, cover and media
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request

          BASE='https://newapi.asmrhentai.net'

          def encode(obj):
              raw=json.dumps(obj,separators=(',',':'),ensure_ascii=False).encode()
              return bytes(((~b)&0xff) for b in raw)[::-1]

          def decode(raw):
              return json.loads(bytes(((~b)&0xff) for b in raw)[::-1].decode())

          def post(path,payload):
              req=urllib.request.Request(
                  BASE+path,
                  data=encode(payload),
                  method='POST',
                  headers={
                      'Content-Type':'f/s',
                      'Accept-Language':'',
                      'User-Agent':'Mozilla/5.0 Hiraukan-Diagnostic/1.0',
                  },
              )
              with urllib.request.urlopen(req,timeout=20) as r:
                  return decode(r.read())

          discover=post('/Core/Discover',{'a':'ja','b':0,'c':0,'d':[]})
          entry=discover['b'][0]
          rj=entry['a']
          info=post('/Core/Info',{'a':'ja','b':rj})

          def first_track(nodes):
              for node in nodes or []:
                  for tr in node.get('b') or []:
                      if tr.get('a'):
                          return tr
                  found=first_track(node.get('c') or [])
                  if found: return found
              return None

          track=first_track(info.get('h') or [])
          print('RJ',rj)
          print('title',info.get('b'))
          print('track',track)

          urls=[
              BASE+'/storage/'+rj+'/cover.avif',
          ]
          if track:
              urls.append(BASE+'/storage/'+rj+'/'+track['a']+'.opus')

          for url in urls:
              req=urllib.request.Request(
                  url,
                  method='GET',
                  headers={'User-Agent':'Mozilla/5.0 Hiraukan-Diagnostic/1.0','Range':'bytes=0-1023'},
              )
              try:
                  with urllib.request.urlopen(req,timeout=20) as resp:
                      head=resp.read(1024)
                      print('URL',url)
                      print('STATUS',resp.status)
                      print('CONTENT-TYPE',resp.headers.get('Content-Type'))
                      print('CONTENT-LENGTH',resp.headers.get('Content-Length'))
                      print('CONTENT-RANGE',resp.headers.get('Content-Range'))
                      print('READ',len(head))
              except Exception as e:
                  print('URL',url)
                  print('ERROR',repr(e))
                  raise
          PY
