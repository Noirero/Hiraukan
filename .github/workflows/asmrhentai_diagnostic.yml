name: ASMR Hentai API Diagnostic

on:
  push:
    branches:
      - diagnostic/asmrhentai-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ASMR Hentai web client
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          curl -fsSL --compressed -A "$UA" https://asmrhentai.net/ -o /tmp/home.html
          echo '=== homepage scripts ==='
          python - <<'PY'
          import re
          h=open('/tmp/home.html','r',encoding='utf-8',errors='ignore').read()
          scripts=re.findall(r'''<script[^>]+src=["']([^"']+)["']''',h,re.I)
          for s in scripts: print(s)
          open('/tmp/scripts.txt','w').write('\n'.join(scripts))
          PY

          echo '=== fetch site scripts ==='
          : > /tmp/all.js
          while IFS= read -r src; do
            case "$src" in
              http://*|https://*) url="$src" ;;
              /*) url="https://asmrhentai.net$src" ;;
              *) url="https://asmrhentai.net/$src" ;;
            esac
            if [[ "$url" == *asmrhentai.net* ]]; then
              echo "--- $url"
              curl -fsSL --compressed -A "$UA" "$url" -o /tmp/one.js || continue
              wc -c /tmp/one.js
              cat /tmp/one.js >> /tmp/all.js
              printf '\n' >> /tmp/all.js
            fi
          done < /tmp/scripts.txt

          echo '=== API endpoints / URL strings ==='
          python - <<'PY'
          import re
          text=open('/tmp/all.js','r',encoding='utf-8',errors='ignore').read()
          patterns=[
              r'https?://[^"\'\s)]+',
              r'/Asmr/[A-Za-z0-9_]+',
              r'Asmr/[A-Za-z0-9_]+',
              r'/[A-Za-z]+/[A-Za-z]+Get',
          ]
          seen=[]
          for pat in patterns:
              for m in re.findall(pat,text):
                  if m not in seen:
                      seen.append(m)
          for x in seen:
              if 'asmr' in x.lower() or x.startswith('/Core/') or 'Get' in x:
                  print(x)
          print('=== contexts ===')
          tokens=['function ia','function ma','/Core/','Search','Discover','Newest','Latest','Popular','fetch(']
          for token in tokens:
              start=0
              count=0
              while True:
                  i=text.find(token,start)
                  if i<0: break
                  print('\n---',token,'@',i,'---')
                  print(text[max(0,i-900):i+1600])
                  start=i+len(token)
                  count += 1
                  if count >= 8: break
          PY
