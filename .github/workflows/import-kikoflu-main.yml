name: Import KikoFlu main

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-kikoflu-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Clone KikoFlu main
        run: |
          git clone --depth 1 --branch main https://github.com/Noirero/KikoFlu.git /tmp/kikoflu

      - name: Replace target contents with KikoFlu main snapshot
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/kikoflu/ ./

      - name: Commit imported snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Target already matches KikoFlu main.'
            exit 0
          fi
          git commit -m 'Import KikoFlu main snapshot'
          git push origin HEAD:main
