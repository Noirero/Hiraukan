name: Temporary ASMR18 Multi-Track Probe

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/temporary-asmr18-multitrack-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe ASMR+18 pages for multiple media files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, urllib.request, urllib.error
          UA="Hiraukan/3.8 UnifiedSources"
          base="https://asmr18.fans"
          cats=["boys","girls","allages"]

          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":UA,"Referer":base+"/"})
              with urllib.request.urlopen(req,timeout=18) as r:
                  return r.read().decode("utf-8","replace")

          works=[]
          for cat in cats:
              try:
                  html=get(f"{base}/{cat}/")
              except Exception as e:
                  print("CATERR",cat,type(e).__name__,e)
                  continue
              for m in re.finditer(r'href=["\'](https?://asmr18\.fans/(?:boys|girls|allages)/(?:rj|bj)\d+/?)["\']',html,re.I):
                  u=m.group(1)
                  if u not in works: works.append(u)
          print("WORKS",len(works))

          media_re=re.compile(r'https?[^"\'<>\\\s]+?\.(?:mp3|m4a|aac|ogg|opus|m3u8)(?:\?[^"\'<>\\\s]*)?',re.I)
          rel_re=re.compile(r'["\']([^"\']+\.(?:mp3|m4a|aac|ogg|opus|m3u8)(?:\?[^"\']*)?)["\']',re.I)
          packed_re=re.compile(r'''eval\(function\(p,a,c,k,e,d\)\{.*?\}\((.*?)\)\)''',re.I|re.S)
          words_re=re.compile(r'''['"]([^'"]+)['"]\.split\(['"]\|['"]\)''')
          code_re=re.compile(r'''^\s*['"]([^'"]*)['"]''')

          def unpack(html):
              out=[]
              for pm in packed_re.finditer(html.replace(r"\/", "/")):
                  args=pm.group(1)
                  wm=words_re.search(args)
                  cm=code_re.search(args)
                  if not wm or not cm: continue
                  words=wm.group(1).split("|")
                  code=cm.group(1)
                  def repl(m):
                      token=m.group(1)
                      try: idx=int(token,36)
                      except: return token
                      if idx<0 or idx>=len(words) or not words[idx]:
                          return token
                      return words[idx]
                  out.append(re.sub(r'\b([0-9a-z]+)\b',repl,code))
              return out

          shown=0
          for url in works[:80]:
              try:
                  html=get(url).replace(r"\/", "/")
              except Exception as e:
                  print("DETAILERR",url,type(e).__name__)
                  continue
              vals=[]
              for doc in [html,*unpack(html)]:
                  for m in media_re.finditer(doc):
                      v=m.group(0)
                      if v not in vals: vals.append(v)
                  for m in rel_re.finditer(doc):
                      v=m.group(1)
                      if v.startswith("/"): v=base+v
                      if v.startswith("http") and v not in vals: vals.append(v)
              rid=(re.search(r'(?:rj|bj)\d+',url,re.I).group(0).upper())
              if len(vals)>1:
                  print("MULTI",rid,url,"COUNT",len(vals))
                  for v in vals[:12]: print(" MEDIA",v)
                  # print nearby player/track labels without dumping full page
                  text=re.sub(r'<[^>]+>',' ',html)
                  text=re.sub(r'\s+',' ',text)
                  for keyword in ["Track1","Track 1","Player 1","MP3","mp3"]:
                      i=text.find(keyword)
                      if i>=0:
                          print(" CONTEXT",text[max(0,i-180):i+700])
                          break
                  shown+=1
                  if shown>=8: break
          print("MULTI_SHOWN",shown)
          PY

      - name: Probe ASMR Hentai media variants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error
          base="https://newapi.asmrhentai.net/storage/RJ244551/a_cpz"
          headers={"User-Agent":"Hiraukan/3.8 UnifiedSources","Referer":"https://asmrhentai.net","Origin":"https://asmrhentai.net","Range":"bytes=0-4095"}
          for ext in ["opus","ogg","m4a","mp3","webm"]:
              url=f"{base}.{ext}"
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=12) as r:
                      data=r.read(4096)
                      print("VARIANT",ext,r.status,r.headers.get("Content-Type"),r.headers.get("Content-Range"),data[:8].hex())
              except urllib.error.HTTPError as e:
                  print("VARIANT",ext,"HTTP",e.code,e.headers.get("Content-Type"))
              except Exception as e:
                  print("VARIANT",ext,"ERR",type(e).__name__,str(e)[:120])
          PY
