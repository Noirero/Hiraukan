name: Android APK Beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ARM64 Beta APK
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare stable beta signing key
        run: |
          set -euo pipefail
          base64 --decode .github/test-signing/hiraukan-test-key.jks.b64 > android/hiraukan-beta-key.jks
          chmod 600 android/hiraukan-beta-key.jks

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android ARM64 Beta APK
        run: |
          set -euo pipefail
          mkdir -p dist
          build_number=$((4000000 + GITHUB_RUN_NUMBER))
          flutter build apk \
            --release \
            --flavor beta \
            --target-platform android-arm64 \
            --split-per-abi \
            --build-number="$build_number"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-beta-release.apk \
            dist/Hiraukan-android-arm64-v8a-beta.apk

      - name: Verify Android Beta identity and signing
        env:
          EXPECTED_PACKAGE: com.noirero.hiraukan.beta
          EXPECTED_CERT_SHA256: c078bbb5af0d981625e1f05b52e0618c1111002c4ff2b2f11dc08a7bab702505
        run: |
          set -euo pipefail
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="$build_tools_dir/aapt"
          apksigner="$build_tools_dir/apksigner"
          apk="dist/Hiraukan-android-arm64-v8a-beta.apk"

          badging="$("$aapt" dump badging "$apk")"
          package_name="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$badging" | head -n1)"
          app_label="$(sed -n "s/^application-label:'\([^']*\)'.*/\1/p" <<< "$badging" | head -n1)"

          if [ "$package_name" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::Unexpected package: $package_name"
            exit 1
          fi
          if [ "$app_label" != "Hiraukan Beta" ]; then
            echo "::error::Unexpected app label: $app_label"
            exit 1
          fi

          cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
          actual_cert="$(
            printf '%s\n' "$cert_output" |
              sed -nE '/certificate SHA-256 digest:/I {
                s/.*certificate SHA-256 digest:[[:space:]]*//I
                p
                q
              }' |
              tr -d '[:space:]:' |
              tr '[:upper:]' '[:lower:]'
          )"
          if [ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected signing certificate: $actual_cert"
            exit 1
          fi

      - name: Upload Android Beta APK
        uses: actions/upload-artifact@v6
        with:
          name: Hiraukan-android-arm64-beta
          path: dist/Hiraukan-android-arm64-v8a-beta.apk
          if-no-files-found: error
          retention-days: 7
