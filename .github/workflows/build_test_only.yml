name: Android APK Main Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-main-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Main arm64 Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Android Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || \
             [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_KEY_ALIAS:-}" ] || \
             [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::All Android release signing secrets are required for the production applicationId."
            exit 1
          fi

          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          cat <<EOF > android/key.properties
          storeFile=app/release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/app/release-key.jks android/key.properties

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build signed arm64 APK
        run: |
          set -euo pipefail
          mkdir -p dist
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             dist/Hiraukan-main-update-arm64-v8a.apk

      - name: Verify Android Main Update Compatibility
        env:
          EXPECTED_PACKAGE_ID: com.meteor.kikoeruflutter
          EXPECTED_CERT_SHA256: 4e6d5e53526058b226d05d075ac95e08b1c795f0e16a3636765438e5d7565c05
        run: |
          set -euo pipefail

          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="$build_tools_dir/aapt"
          apksigner="$build_tools_dir/apksigner"
          apk="dist/Hiraukan-main-update-arm64-v8a.apk"

          for tool in "$aapt" "$apksigner"; do
            if [ ! -x "$tool" ]; then
              echo "::error::Required Android build tool not found: $tool"
              exit 1
            fi
          done

          badging="$("$aapt" dump badging "$apk")"
          package_line="$(printf '%s\n' "$badging" | sed -n '1p')"
          package_name="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$package_line")"
          native_code="$(printf '%s\n' "$badging" | sed -n "s/^native-code: //p" | head -n 1)"

          if [ "$package_name" != "$EXPECTED_PACKAGE_ID" ]; then
            echo "::error::Unexpected package id: $package_name"
            exit 1
          fi
          if ! grep -q "arm64-v8a" <<< "$native_code"; then
            echo "::error::APK is not arm64-v8a: $native_code"
            exit 1
          fi
          if grep -Eq "armeabi-v7a|x86|x86_64" <<< "$native_code"; then
            echo "::error::APK contains an unexpected ABI: $native_code"
            exit 1
          fi

          cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
          actual_cert="$(
            printf '%s\n' "$cert_output" |
              sed -nE '/certificate SHA-256 digest:/I {
                s/.*certificate SHA-256 digest:[[:space:]]*//I
                p
                q
              }' |
              tr -d '[:space:]:' |
              tr '[:upper:]' '[:lower:]'
          )"

          if [ -z "$actual_cert" ]; then
            echo "::error::Unable to read Android signing certificate."
            exit 1
          fi
          if [ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected Android signing certificate: $actual_cert"
            exit 1
          fi

          echo "Verified update-compatible package id and signing certificate."
          echo "native-code=$native_code"
          echo "certificate-sha256=$actual_cert"

      - name: Upload Android Main Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Hiraukan-main-update-arm64-v8a
          path: dist/Hiraukan-main-update-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7
