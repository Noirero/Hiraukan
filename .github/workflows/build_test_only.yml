name: Hiraukan Beta Build
run-name: Hiraukan Beta APK · ${{ github.sha }}

# Manual-only standalone Beta APK build, matching Miyorare's Beta flow.
# Regular commits and pull requests to beta do not build an APK automatically.
# Use Actions > Hiraukan Beta Build > Run workflow and select branch beta.
on:
  workflow_dispatch:
    inputs:
      asr_endpoint:
        description: 'Online ASR endpoint; leave blank to use repository variable HIRAUAKAN_ONLINE_ASR_ENDPOINT'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hiraukan-beta-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build signed Hiraukan Beta ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Beta HEAD
        uses: actions/checkout@v6

      - name: Require beta branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "beta" ]; then
            echo "::error::Official Hiraukan Beta APKs may only be built from the beta branch."
            exit 1
          fi
          echo "Building Hiraukan Beta from ${GITHUB_SHA}"

      - name: Prepare stable beta signing key
        run: |
          set -euo pipefail
          base64 --decode .github/test-signing/hiraukan-test-key.jks.b64 > android/hiraukan-beta-key.jks
          chmod 600 android/hiraukan-beta-key.jks

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Beta regression tests
        run: |
          flutter test \
            test/source_capabilities_test.dart \
            test/additional_audio_extensions_test.dart \
            test/chapter_audio_engine_test.dart \
            test/audio_stream_strategy_test.dart \
            test/subtitle_foundation_test.dart \
            test/unified_source_playback_capability_test.dart \
            test/locale_default_indonesian_test.dart \
            test/online_translation_contract_test.dart \
            test/online_translation_hardening_test.dart \
            test/ai_subtitle_stage2_test.dart \
            test/auto_asr_translate_fallback_test.dart \
            test/fast_asr_whisper_stage4_test.dart \
            test/hq_asr_whisper_stage4_test.dart \
            test/asr_benchmark_test.dart \
            test/asr_benchmark_lab_test.dart \
            test/ai_translation_stage3_test.dart \
            test/unified_source_service_test.dart

      - name: Run targeted feature tests when present
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            test/local_collection_service_test.dart
            test/listening_moment_service_test.dart
            test/portable_backup_service_test.dart
            test/portable_backup_sanitizer_test.dart
            test/offline_package_service_test.dart
            test/player_buttons_default_hierarchy_test.dart
            test/player_buttons_persisted_order_test.dart
            test/work_download_actions_button_test.dart
            test/subtitle_language_hub_test.dart
          )
          present=()
          for test_file in "${candidates[@]}"; do
            if [ -f "$test_file" ]; then
              present+=("$test_file")
            fi
          done
          if [ "${#present[@]}" -eq 0 ]; then
            echo "No targeted feature tests are present on this ref."
            exit 0
          fi
          printf 'Running targeted feature tests:\n'
          printf ' - %s\n' "${present[@]}"
          flutter test "${present[@]}"

      - name: Compute monotonic Beta versionCode
        id: beta_version
        shell: bash
        run: |
          set -euo pipefail
          # Epoch seconds give Beta artifacts one chronological versionCode
          # across manual build and release workflows, so newer Beta APKs can
          # update older Beta installs regardless of which trusted path produced it.
          build_number="$(date -u +%s)"
          if [ "$build_number" -le 0 ] || [ "$build_number" -gt 2099997999 ]; then
            echo "::error::Computed Beta versionCode is outside Android's safe range: $build_number"
            exit 1
          fi
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Build Android ARM64 Beta APK
        env:
          HIRAUAKAN_ONLINE_ASR_ENDPOINT: ${{ inputs.asr_endpoint || vars.HIRAUAKAN_ONLINE_ASR_ENDPOINT }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -z "$HIRAUAKAN_ONLINE_ASR_ENDPOINT" ]; then
            echo "::notice::No online ASR endpoint configured; local Whisper remains available after the user downloads a model."
          fi
          flutter build apk \
            --release \
            --flavor beta \
            --target-platform android-arm64 \
            --split-per-abi \
            --dart-define=HIRAUAKAN_ONLINE_ASR_ENDPOINT="$HIRAUAKAN_ONLINE_ASR_ENDPOINT" \
            --build-number="${{ steps.beta_version.outputs.build_number }}"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-beta-release.apk \
            dist/Hiraukan-android-arm64-v8a-beta.apk

      - name: Verify Android Beta identity, version, ABI and signing
        env:
          EXPECTED_PACKAGE: com.noirero.hiraukan.beta
          EXPECTED_CERT_SHA256: c078bbb5af0d981625e1f05b52e0618c1111002c4ff2b2f11dc08a7bab702505
          EXPECTED_BASE_VERSION_CODE: ${{ steps.beta_version.outputs.build_number }}
        run: |
          set -euo pipefail
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="$build_tools_dir/aapt"
          apksigner="$build_tools_dir/apksigner"
          apk="dist/Hiraukan-android-arm64-v8a-beta.apk"

          badging="$("$aapt" dump badging "$apk")"
          package_line="$(printf '%s\n' "$badging" | sed -n '1p')"
          package_name="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$package_line")"
          version_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$package_line")"
          native_code="$(printf '%s\n' "$badging" | sed -n "s/^native-code: //p" | head -n1)"
          app_label="$(sed -n "s/^application-label:'\([^']*\)'.*/\1/p" <<< "$badging" | head -n1)"

          if [ "$package_name" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::Unexpected package: $package_name"
            exit 1
          fi
          if [ "$app_label" != "Hiraukan Beta" ]; then
            echo "::error::Unexpected app label: $app_label"
            exit 1
          fi
          expected_arm64_code=$((EXPECTED_BASE_VERSION_CODE + 2000))
          if [ "$version_code" -ne "$expected_arm64_code" ]; then
            echo "::error::Unexpected ARM64 versionCode: $version_code (expected $expected_arm64_code)"
            exit 1
          fi
          if ! grep -q "arm64-v8a" <<< "$native_code"; then
            echo "::error::APK is not arm64-v8a: $native_code"
            exit 1
          fi
          if grep -Eq "armeabi-v7a|x86|x86_64" <<< "$native_code"; then
            echo "::error::Unexpected ABI set: $native_code"
            exit 1
          fi

          cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
          actual_cert="$(
            printf '%s\n' "$cert_output" |
              sed -nE '/certificate SHA-256 digest:/I {
                s/.*certificate SHA-256 digest:[[:space:]]*//I
                p
                q
              }' |
              tr -d '[:space:]:' |
              tr '[:upper:]' '[:lower:]'
          )"
          if [ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected signing certificate: $actual_cert"
            exit 1
          fi

          apk_size_bytes="$(stat -c%s "$apk")"
          apk_size_mib=$(( (apk_size_bytes + 1048575) / 1048576 ))
          echo "Beta APK size before any downloaded AI model: ${apk_size_mib} MiB"
          if [ "$apk_size_bytes" -gt $((95 * 1024 * 1024)) ]; then
            echo "::error::Beta APK exceeds 95 MiB before AI model downloads: ${apk_size_mib} MiB"
            exit 1
          fi

          echo "Verified BETA build: package=$package_name versionCode=$version_code ABI=$native_code"

      - name: Collect APK and compute checksums
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          source_apk="dist/Hiraukan-android-arm64-v8a-beta.apk"
          test -f "$source_apk" || { echo "::error::No Hiraukan Beta APK found."; exit 1; }

          short_sha="$(git rev-parse --short HEAD)"
          apk_name="Hiraukan-Beta-${short_sha}.apk"
          apk_path="dist/${apk_name}"
          mv "$source_apk" "$apk_path"

          sha256="$(sha256sum "$apk_path" | awk '{print $1}')"
          sha1="$(sha1sum "$apk_path" | awk '{print $1}')"
          md5="$(md5sum "$apk_path" | awk '{print $1}')"
          size="$(du -h "$apk_path" | cut -f1)"

          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

          {
            echo "**Hiraukan Beta manual build**"
            echo ""
            echo "This APK uses \`com.noirero.hiraukan.beta\` and is produced only from the \`beta\` branch."
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| File | \`${apk_name}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${short_sha}\` |"
            echo "| Size | ${size} |"
            echo "| SHA-256 | \`${sha256}\` |"
            echo "| SHA-1 | \`${sha1}\` |"
            echo "| MD5 | \`${md5}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove decoded signing key
        if: always()
        run: rm -f android/hiraukan-beta-key.jks

      - name: Upload Hiraukan Beta APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
