name: Android APK test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Android Signing
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret missing; skipping signing setup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          cat <<EOF > android/key.properties
          storeFile=app/release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/app/release-key.jks android/key.properties
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android ARM64 APK
        run: |
          set -euo pipefail
          mkdir -p dist
          flutter build apk --release --split-per-abi
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Hiraukan-android-arm64-v8a-test.apk

      - name: Verify Android Package
        env:
          SIGNING_CONFIGURED: ${{ steps.android_signing.outputs.configured }}
          EXPECTED_CERT_SHA256: b49fcc1a879b7dab15f223f7431dfbee447dbe268d1578fc549340c430ddc87f
        run: |
          set -euo pipefail

          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="$build_tools_dir/aapt"
          apksigner="$build_tools_dir/apksigner"
          apk="dist/Hiraukan-android-arm64-v8a-test.apk"

          for tool in "$aapt" "$apksigner"; do
            if [ ! -x "$tool" ]; then
              echo "::error::Required Android build tool not found: $tool"
              exit 1
            fi
          done

          badging="$("$aapt" dump badging "$apk" | sed -n '1p')"
          package_name="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$badging")"
          if [ "$package_name" != "com.meteor.kikoeruflutter" ]; then
            echo "::error::Unexpected Android package metadata: $badging"
            exit 1
          fi

          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
            actual_cert="$(
              printf '%s\n' "$cert_output" |
                sed -nE '/certificate SHA-256 digest:/I {
                  s/.*certificate SHA-256 digest:[[:space:]]*//I
                  p
                  q
                }' |
                tr -d '[:space:]:' |
                tr '[:upper:]' '[:lower:]'
            )"
            if [ -z "$actual_cert" ]; then
              echo "::error::Unable to read Android signing certificate."
              printf '%s\n' "$cert_output" >&2
              exit 1
            fi
            if [ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::Unexpected Android signing certificate: $actual_cert"
              exit 1
            fi
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: Hiraukan-android-arm64-test
          path: dist/Hiraukan-android-arm64-v8a-test.apk
          if-no-files-found: error
          retention-days: 7
