name: Android APK Beta

on:
  push:
    branches:
      - beta
  pull_request:
    branches:
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Analyze, test, and build ARM64 Beta APK
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare stable beta signing key
        run: |
          set -euo pipefail
          base64 --decode .github/test-signing/hiraukan-test-key.jks.b64 > android/hiraukan-beta-key.jks
          chmod 600 android/hiraukan-beta-key.jks

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Beta regression tests
        run: |
          flutter test \
            test/source_capabilities_test.dart \
            test/subtitle_foundation_test.dart \
            test/unified_source_playback_capability_test.dart \
            test/locale_default_indonesian_test.dart \
            test/local_ai_translation_contract_test.dart \
            test/ai_subtitle_stage2_test.dart \
            test/ai_translation_stage3_test.dart \
            test/fast_asr_stage4_test.dart \
            test/unified_source_service_test.dart

      - name: Compute monotonic Beta versionCode
        id: beta_version
        run: |
          set -euo pipefail
          # Epoch seconds give Beta artifacts one chronological versionCode
          # across PR, push and release workflows, so newer Beta builds can
          # update older Beta installs regardless of which workflow produced it.
          build_number="$(date -u +%s)"
          if [ "$build_number" -le 0 ] || [ "$build_number" -gt 2099997999 ]; then
            echo "::error::Computed Beta versionCode is outside Android's safe range: $build_number"
            exit 1
          fi
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Build Android ARM64 Beta APK
        run: |
          set -euo pipefail
          mkdir -p dist
          flutter build apk \
            --release \
            --flavor beta \
            --target-platform android-arm64 \
            --split-per-abi \
            --build-number="${{ steps.beta_version.outputs.build_number }}"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-beta-release.apk \
            dist/Hiraukan-android-arm64-v8a-beta.apk

      - name: Verify Android Beta identity, version, ABI and signing
        env:
          EXPECTED_PACKAGE: com.noirero.hiraukan.beta
          EXPECTED_CERT_SHA256: c078bbb5af0d981625e1f05b52e0618c1111002c4ff2b2f11dc08a7bab702505
          EXPECTED_BASE_VERSION_CODE: ${{ steps.beta_version.outputs.build_number }}
        run: |
          set -euo pipefail
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="$build_tools_dir/aapt"
          apksigner="$build_tools_dir/apksigner"
          apk="dist/Hiraukan-android-arm64-v8a-beta.apk"

          badging="$("$aapt" dump badging "$apk")"
          package_line="$(printf '%s\n' "$badging" | sed -n '1p')"
          package_name="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$package_line")"
          version_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$package_line")"
          native_code="$(printf '%s\n' "$badging" | sed -n "s/^native-code: //p" | head -n1)"
          app_label="$(sed -n "s/^application-label:'\([^']*\)'.*/\1/p" <<< "$badging" | head -n1)"

          if [ "$package_name" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::Unexpected package: $package_name"
            exit 1
          fi
          if [ "$app_label" != "Hiraukan Beta" ]; then
            echo "::error::Unexpected app label: $app_label"
            exit 1
          fi
          expected_arm64_code=$((EXPECTED_BASE_VERSION_CODE + 2000))
          if [ "$version_code" -ne "$expected_arm64_code" ]; then
            echo "::error::Unexpected ARM64 versionCode: $version_code (expected $expected_arm64_code)"
            exit 1
          fi
          if ! grep -q "arm64-v8a" <<< "$native_code"; then
            echo "::error::APK is not arm64-v8a: $native_code"
            exit 1
          fi
          if grep -Eq "armeabi-v7a|x86|x86_64" <<< "$native_code"; then
            echo "::error::Unexpected ABI set: $native_code"
            exit 1
          fi

          cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
          actual_cert="$(
            printf '%s\n' "$cert_output" |
              sed -nE '/certificate SHA-256 digest:/I {
                s/.*certificate SHA-256 digest:[[:space:]]*//I
                p
                q
              }' |
              tr -d '[:space:]:' |
              tr '[:upper:]' '[:lower:]'
          )"
          if [ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected signing certificate: $actual_cert"
            exit 1
          fi

          apk_size_bytes="$(stat -c%s "$apk")"
          apk_size_mib=$(( (apk_size_bytes + 1048575) / 1048576 ))
          echo "Beta APK size before any downloaded AI model: ${apk_size_mib} MiB"
          if [ "$apk_size_bytes" -gt $((95 * 1024 * 1024)) ]; then
            echo "::error::Beta APK exceeds 95 MiB before AI model downloads: ${apk_size_mib} MiB"
            exit 1
          fi

          echo "Verified BETA build: package=$package_name versionCode=$version_code ABI=$native_code"

      - name: Upload Android Beta APK
        uses: actions/upload-artifact@v6
        with:
          name: Hiraukan-android-arm64-beta
          path: dist/Hiraukan-android-arm64-v8a-beta.apk
          if-no-files-found: error
          retention-days: 7
