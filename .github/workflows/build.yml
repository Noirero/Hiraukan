name: Hiraukan Beta Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version, for example 3.8.3 or v3.8.3'
        required: true
        type: string
      release_notes:
        description: 'Beta release notes in Markdown'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hiraukan-beta-android-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Beta Release Metadata
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      suffix: ${{ steps.version.outputs.suffix }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Normalize and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH, for example 3.8.3."
            exit 1
          fi

          tag="v${version}-beta"
          suffix="${version//./}"
          build_number="$(date -u +%s)"
          if [ "$build_number" -le 0 ] || [ "$build_number" -gt 2099997999 ]; then
            echo "::error::Computed Beta versionCode is outside Android's safe range: $build_number"
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Beta release $tag already exists. Choose a new version."
            exit 1
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Git tag $tag already exists. Choose a new version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

  android:
    name: Build signed Hiraukan Beta ARM64 APK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare stable Beta signing key
        run: |
          set -euo pipefail
          base64 --decode .github/test-signing/hiraukan-test-key.jks.b64 > android/hiraukan-beta-key.jks
          chmod 600 android/hiraukan-beta-key.jks

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Beta regression tests
        run: |
          flutter test \
            test/source_capabilities_test.dart \
            test/subtitle_foundation_test.dart \
            test/unified_source_playback_capability_test.dart \
            test/locale_default_indonesian_test.dart \
            test/unified_source_service_test.dart

      - name: Build Android ARM64 Beta APK
        run: |
          set -euo pipefail
          mkdir -p dist
          flutter build apk \
            --release \
            --flavor beta \
            --target-platform android-arm64 \
            --split-per-abi \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ needs.prepare.outputs.build_number }}"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-beta-release.apk \
            "dist/Hiraukan-Beta-android-arm64-v8a_${{ needs.prepare.outputs.suffix }}.apk"

      - name: Verify Beta identity, version, ABI and signing
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}-beta
          EXPECTED_BASE_VERSION_CODE: ${{ needs.prepare.outputs.build_number }}
          EXPECTED_CERT_SHA256: c078bbb5af0d981625e1f05b52e0618c1111002c4ff2b2f11dc08a7bab702505
        run: |
          set -euo pipefail
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="$build_tools_dir/aapt"
          apksigner="$build_tools_dir/apksigner"
          apk="dist/Hiraukan-Beta-android-arm64-v8a_${{ needs.prepare.outputs.suffix }}.apk"

          badging="$("$aapt" dump badging "$apk")"
          package_line="$(printf '%s\n' "$badging" | sed -n '1p')"
          package_name="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$package_line")"
          version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$package_line")"
          version_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$package_line")"
          native_code="$(printf '%s\n' "$badging" | sed -n "s/^native-code: //p" | head -n1)"
          app_label="$(sed -n "s/^application-label:'\([^']*\)'.*/\1/p" <<< "$badging" | head -n1)"

          if [ "$package_name" != "com.noirero.hiraukan.beta" ]; then
            echo "::error::Unexpected Beta package: $package_name"
            exit 1
          fi
          if [ "$version_name" != "$EXPECTED_VERSION" ]; then
            echo "::error::Unexpected Beta versionName: $version_name"
            exit 1
          fi
          if [ "$app_label" != "Hiraukan Beta" ]; then
            echo "::error::Unexpected Beta app label: $app_label"
            exit 1
          fi

          expected_arm64_code=$((EXPECTED_BASE_VERSION_CODE + 2000))
          if [ "$version_code" -ne "$expected_arm64_code" ]; then
            echo "::error::Unexpected ARM64 versionCode: $version_code (expected $expected_arm64_code)"
            exit 1
          fi
          if ! grep -q "arm64-v8a" <<< "$native_code"; then
            echo "::error::Beta APK is not arm64-v8a: $native_code"
            exit 1
          fi
          if grep -Eq "armeabi-v7a|x86|x86_64" <<< "$native_code"; then
            echo "::error::Unexpected ABI set: $native_code"
            exit 1
          fi

          cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
          actual_cert="$(
            printf '%s\n' "$cert_output" |
              sed -nE '/certificate SHA-256 digest:/I {
                s/.*certificate SHA-256 digest:[[:space:]]*//I
                p
                q
              }' |
              tr -d '[:space:]:' |
              tr '[:upper:]' '[:lower:]'
          )"
          if [ "$actual_cert" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Unexpected Beta signing certificate: $actual_cert"
            exit 1
          fi

          echo "Verified BETA release APK: package=$package_name versionName=$version_name versionCode=$version_code"

      - name: Upload Beta release APK
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-hiraukan-beta
          path: dist/Hiraukan-Beta-android-arm64-v8a_${{ needs.prepare.outputs.suffix }}.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Hiraukan Beta GitHub Prerelease
    needs:
      - prepare
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Beta release artifact
        uses: actions/download-artifact@v6
        with:
          name: release-assets-hiraukan-beta
          path: release-assets

      - name: Verify and publish Beta prerelease atomically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          ASSET_NAME: Hiraukan-Beta-android-arm64-v8a_${{ needs.prepare.outputs.suffix }}.apk
        run: |
          set -euo pipefail
          asset="release-assets/$ASSET_NAME"
          if [ ! -s "$asset" ]; then
            echo "::error::Missing or empty Beta APK: $ASSET_NAME"
            exit 1
          fi

          release_id=""
          release_tag=""
          draft_created=false
          cleanup_draft() {
            status="$1"
            trap - ERR INT TERM
            if [ "$draft_created" = "true" ] && [ -n "$release_id" ]; then
              gh api --method DELETE "repos/${GH_REPO}/releases/${release_id}" || true
              if [ "$release_tag" = "$TAG" ] && gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
                gh api --method DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}" || true
              fi
            fi
            exit "$status"
          }
          trap 'cleanup_draft $?' ERR
          trap 'cleanup_draft 130' INT
          trap 'cleanup_draft 143' TERM

          release_json="$(gh api --method POST "repos/${GH_REPO}/releases" \
            -f "tag_name=${TAG}" \
            -f "target_commitish=${GITHUB_SHA}" \
            -f "name=Hiraukan Beta ${VERSION}" \
            -f "body=${RELEASE_NOTES}" \
            -F 'draft=true' \
            -F 'prerelease=true')"
          release_id="$(jq -r '.id // empty' <<< "$release_json")"
          release_tag="$(jq -r '.tag_name // empty' <<< "$release_json")"
          upload_url="$(jq -r '.upload_url // empty' <<< "$release_json" | sed 's/{?name,label}$//')"
          if [ -z "$release_id" ] || [ -z "$upload_url" ]; then
            echo "::error::GitHub did not return a usable Beta draft release."
            exit 1
          fi
          draft_created=true

          encoded_name="$(jq -nr --arg name "$ASSET_NAME" '$name | @uri')"
          curl --fail-with-body --silent --show-error \
            --request POST "${upload_url}?name=${encoded_name}" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/octet-stream' \
            --data-binary "@${asset}"

          uploaded_size="$(gh api "repos/${GH_REPO}/releases/${release_id}" --jq ".assets[] | select(.name == \"${ASSET_NAME}\") | .size")"
          if [ -z "$uploaded_size" ] || [ "$uploaded_size" -le 0 ]; then
            echo "::error::Uploaded Beta APK is missing or empty."
            exit 1
          fi

          gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" \
            -F 'draft=false' \
            -F 'prerelease=true' >/dev/null
          draft_created=false
          trap - ERR INT TERM
