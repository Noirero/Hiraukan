name: Main Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 3.8.3 or v3.8.3'
        required: true
        type: string
      release_notes:
        description: 'Release notes in Markdown'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hiraukan-android-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Main Release Metadata
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      suffix: ${{ steps.version.outputs.suffix }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Normalize and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version must use MAJOR.MINOR.PATCH, for example 3.8.3."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( minor > 999 || patch > 999 )); then
            echo "::error::MINOR and PATCH must be 0-999."
            exit 1
          fi

          build_number=$((major * 1000000 + minor * 1000 + patch))
          if (( build_number <= 0 || build_number > 2100000000 )); then
            echo "::error::Computed Android versionCode is outside the supported range."
            exit 1
          fi

          tag="v${version}"
          suffix="${version//./}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Choose a new version."
            exit 1
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Git tag $tag already exists. Choose a new version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

  android:
    name: Android ARM64 Main Release APK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Require permanent Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required. Production releases must never fall back to a debug/test key."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
          cat <<PROPS > android/key.properties
          storeFile=app/release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS
          chmod 600 android/app/release-key.jks android/key.properties

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android ARM64 APK
        run: |
          set -euo pipefail
          mkdir -p dist
          flutter build apk \
            --release \
            --flavor prod \
            --target-platform android-arm64 \
            --split-per-abi \
            --build-name="${{ needs.prepare.outputs.version }}" \
            --build-number="${{ needs.prepare.outputs.build_number }}"
          mv build/app/outputs/flutter-apk/app-prod-arm64-v8a-release.apk \
            "dist/Hiraukan-android-arm64-v8a_${{ needs.prepare.outputs.suffix }}.apk"

      - name: Verify Android identity, version, and signing
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="$build_tools_dir/aapt"
          apksigner="$build_tools_dir/apksigner"
          apk="dist/Hiraukan-android-arm64-v8a_${{ needs.prepare.outputs.suffix }}.apk"

          badging="$("$aapt" dump badging "$apk")"
          package_name="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$badging" | head -n1)"
          version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$badging" | head -n1)"
          app_label="$(sed -n "s/^application-label:'\([^']*\)'.*/\1/p" <<< "$badging" | head -n1)"

          if [ "$package_name" != "com.noirero.hiraukan" ]; then
            echo "::error::Unexpected package: $package_name"
            exit 1
          fi
          if [ "$version_name" != "$EXPECTED_VERSION" ]; then
            echo "::error::Unexpected versionName: $version_name"
            exit 1
          fi
          if [ "$app_label" != "Hiraukan" ]; then
            echo "::error::Unexpected app label: $app_label"
            exit 1
          fi

          expected_cert="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          cert_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
          actual_cert="$(
            printf '%s\n' "$cert_output" |
              sed -nE '/certificate SHA-256 digest:/I {
                s/.*certificate SHA-256 digest:[[:space:]]*//I
                p
                q
              }' |
              tr -d '[:space:]:' |
              tr '[:upper:]' '[:lower:]'
          )"
          if [ -z "$actual_cert" ] || [ "$actual_cert" != "$expected_cert" ]; then
            echo "::error::Android release signing certificate mismatch: $actual_cert"
            exit 1
          fi

      - name: Upload Android release APK
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-android
          path: dist/Hiraukan-android-arm64-v8a_${{ needs.prepare.outputs.suffix }}.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs:
      - prepare
      - android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android release artifact
        uses: actions/download-artifact@v6
        with:
          name: release-assets-android
          path: release-assets

      - name: Verify and publish release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          ASSET_NAME: Hiraukan-android-arm64-v8a_${{ needs.prepare.outputs.suffix }}.apk
        run: |
          set -euo pipefail
          asset="release-assets/$ASSET_NAME"
          if [ ! -s "$asset" ]; then
            echo "::error::Missing or empty Android release APK: $ASSET_NAME"
            exit 1
          fi

          release_id=""
          release_tag=""
          draft_created=false
          cleanup_draft() {
            status="$1"
            trap - ERR INT TERM
            if [ "$draft_created" = "true" ] && [ -n "$release_id" ]; then
              gh api --method DELETE "repos/${GH_REPO}/releases/${release_id}" || true
              if [ "$release_tag" = "$TAG" ] && gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
                gh api --method DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}" || true
              fi
            fi
            exit "$status"
          }
          trap 'cleanup_draft $?' ERR
          trap 'cleanup_draft 130' INT
          trap 'cleanup_draft 143' TERM

          release_json="$(gh api --method POST "repos/${GH_REPO}/releases" \
            -f "tag_name=${TAG}" \
            -f "target_commitish=${GITHUB_SHA}" \
            -f "name=${TAG}" \
            -f "body=${RELEASE_NOTES}" \
            -F 'draft=true' \
            -F 'prerelease=false')"
          release_id="$(jq -r '.id // empty' <<< "$release_json")"
          release_tag="$(jq -r '.tag_name // empty' <<< "$release_json")"
          upload_url="$(jq -r '.upload_url // empty' <<< "$release_json" | sed 's/{?name,label}$//')"
          if [ -z "$release_id" ] || [ -z "$upload_url" ]; then
            echo "::error::GitHub did not return a usable draft release."
            exit 1
          fi
          draft_created=true

          encoded_name="$(jq -nr --arg name "$ASSET_NAME" '$name | @uri')"
          curl --fail-with-body --silent --show-error \
            --request POST "${upload_url}?name=${encoded_name}" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/octet-stream' \
            --data-binary "@${asset}"

          uploaded_size="$(gh api "repos/${GH_REPO}/releases/${release_id}" --jq ".assets[] | select(.name == \"${ASSET_NAME}\") | .size")"
          if [ -z "$uploaded_size" ] || [ "$uploaded_size" -le 0 ]; then
            echo "::error::Uploaded APK is missing or empty in draft release."
            exit 1
          fi

          gh api --method PATCH "repos/${GH_REPO}/releases/${release_id}" \
            -F 'draft=false' \
            -f 'make_latest=true' >/dev/null
          draft_created=false
          trap - ERR INT TERM
