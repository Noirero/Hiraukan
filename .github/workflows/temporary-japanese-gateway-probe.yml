name: Temporary JapaneseASMR Gateway Probe

on:
  push:
    branches: [beta]
    paths:
      - .github/workflows/temporary-japanese-gateway-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe direct and fallback gateways
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, re

          UA = "Hiraukan/3.8 Gateway Probe"
          targets = [
              ("direct-home", "https://japaneseasmr.com/"),
              ("jina-home", "https://r.jina.ai/https://japaneseasmr.com/"),
              ("allorigins-home", "https://api.allorigins.win/raw?url=" + urllib.parse.quote("https://japaneseasmr.com/", safe="")),
              ("jina-detail", "https://r.jina.ai/https://japaneseasmr.com/150698/"),
              ("allorigins-detail", "https://api.allorigins.win/raw?url=" + urllib.parse.quote("https://japaneseasmr.com/150698/", safe="")),
          ]
          for label, url in targets:
              print("\n==", label, url, "==")
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read()
                      text = body.decode("utf-8", "replace")
                      print("STATUS", r.status, "TYPE", r.headers.get("Content-Type"), "BYTES", len(body))
                      print("NUMERIC_LINKS", re.findall(r'https?://(?:www\\.)?japaneseasmr\\.com/(\\d+)/?', text, re.I)[:10])
                      print("RJ", re.findall(r'RJ\\d{5,10}', text, re.I)[:10])
                      media = re.findall(r'https?://[^\\"\'<>\\s)]+?\\.(?:m3u8|mp3|m4a|opus)(?:\\?[^\\"\'<>\\s)]*)?', text, re.I)
                      print("MEDIA", media[:10])
                      print("HEAD", re.sub(r'\\s+', ' ', text[:1200])[:1200])
                      for needle in ["00:00:00", "総再生時間", "Player 1", "weeab0o", "weeabo0"]:
                          idx = text.find(needle)
                          if idx >= 0:
                              print("CTX", needle, re.sub(r'\\s+', ' ', text[max(0,idx-500):idx+1800])[:2300])
              except Exception as e:
                  print("ERROR", type(e).__name__, str(e)[:240])
          PY
