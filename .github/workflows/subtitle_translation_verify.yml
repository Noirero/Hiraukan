name: Subtitle Translation Verify

on:
  push:
    branches:
      - feature/subtitle-translation-id
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subtitle-translation-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Flutter subtitle translation verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run subtitle translation tests
        run: |
          flutter test \
            test/subtitle_translation_test.dart \
            test/translation_service_provider_test.dart \
            test/translation_target_language_test.dart \
            test/translation_language_preferences_test.dart \
            test/subtitle_controller_test.dart \
            test/subtitle_format_adapter_test.dart \
            test/subtitle_identity_test.dart

      - name: Analyze translation changes
        run: |
          flutter analyze --no-pub lib/src/subtitles
          flutter analyze --no-pub lib/src/services/translation_service.dart
          flutter analyze --no-pub lib/src/services/youdao_translator.dart
          flutter analyze --no-pub lib/src/services/microsoft_translator.dart
          flutter analyze --no-pub lib/src/services/llm_translator.dart
          flutter analyze --no-pub lib/src/providers/settings_provider.dart
          flutter analyze --no-pub lib/src/utils/l10n_extensions.dart
          flutter analyze --no-pub test/subtitle_translation_test.dart
          flutter analyze --no-pub test/translation_service_provider_test.dart
          flutter analyze --no-pub test/translation_target_language_test.dart
          flutter analyze --no-pub test/translation_language_preferences_test.dart
